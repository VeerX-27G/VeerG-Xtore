<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Bootstrap 5 CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
<link rel="stylesheet" href="css/style.css">
<title>Order history — Xtore</title>
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <a href="index.html" class="wordmark">VeerG <span class="badge-xtore">Xtore</span></a>
    <nav class="main-nav">
      <a href="index.html" data-nav-link>Shop</a>
      <a href="orders.html" data-nav-link class="active">Orders</a>
      <span class="nav-user" data-user-slot></span>
    </nav>
    <a href="cart.html" class="nav-cart">
      Cart <span class="count" data-cart-count>0</span>
    </a>
  </div>
</header>

<main class="wrap">
  <h1 class="page-title">Order history</h1>
  <p class="page-sub" id="orders-sub">Every order placed with your account.</p>

  <div id="orders-list" style="margin: 26px 0 80px;"></div>
</main>

<footer class="site-footer">
  <div class="wrap">
    <span>VeerG's Xtore — a class project storefront.</span>
    <span>Secure payments powered by Stripe.</span>
  </div>
</footer>

<!-- Bootstrap 5 Bundle JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
<script src="js/app.js"></script>
<script>
  const list = document.getElementById("orders-list");
  const sub = document.getElementById("orders-sub");
  const params = new URLSearchParams(location.search);
  const justPlaced = params.get("justPlaced");

  async function renderOrders() {
    if (!Store.getUser()) {
      sub.textContent = "Sign in to view your order history.";
      list.innerHTML = `<div class="empty-state"><h3>Your orders are private</h3><p>Sign in to see orders placed with your account.</p><a href="login.html" class="btn">Sign in</a></div>`;
      return;
    }
    let orders;
    try { orders = await Store.api("/orders"); }
    catch (error) { sub.textContent = error.message; return; }
    if (justPlaced) showToast(`Order ${justPlaced} confirmed`);
    if (orders.length === 0) {
      sub.textContent = "No orders yet.";
      list.innerHTML = `
        <div class="empty-state">
          <h3>No entries in your Xtore orders</h3>
          <p>Orders you place will be listed here.</p>
          <a href="index.html" class="btn">Start shopping</a>
        </div>`;
    } else {
      sub.textContent = `${orders.length} order${orders.length === 1 ? "" : "s"} placed.`;
      list.innerHTML = orders.map(o => `
        <div class="order-card">
          <div class="order-head">
            <div>
              <div class="oid">${o.id}</div>
              <div class="odate">${new Date(o.date).toLocaleString(undefined, { dateStyle: "medium", timeStyle: "short" })} &middot; shipped to ${o.shipTo}</div>
            </div>
            <span class="order-status">${o.status}</span>
          </div>
          <div class="order-body">
            ${o.items.map(l => `<div class="order-item-row"><span>${l.name} &times; ${l.qty}</span><span class="n">${money(l.price * l.qty)}</span></div>`).join("")}
          </div>
          <div class="order-foot">
            <span>Total</span>
            <span>${money(o.totals.total)}</span>
          </div>
        </div>
      `).join("");
    }
  }
  renderOrders();
</script>
</body>
</html>
