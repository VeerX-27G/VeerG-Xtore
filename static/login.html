<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Bootstrap 5 CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
<link rel="stylesheet" href="css/style.css">
<title>Sign in — Xtore</title>
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <a href="index.html" class="wordmark">VeerG <span class="badge-xtore">Xtore</span></a>
    <nav class="main-nav">
      <a href="index.html" data-nav-link>Shop</a>
      <a href="orders.html" data-nav-link>Orders</a>
      <span class="nav-user" data-user-slot></span>
    </nav>
    <a href="cart.html" class="nav-cart">
      Cart <span class="count" data-cart-count>0</span>
    </a>
  </div>
</header>

<main class="auth-layout wrap">
  <div class="auth-card">
    <h1>Sign in</h1>
    <p class="sub">Welcome back to Xtore.</p>

    <form id="login-form" novalidate>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" placeholder="you@example.com" required>
        <div class="error-msg">Enter a valid email.</div>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" placeholder="Your password" required>
        <div class="error-msg">Enter your password.</div>
      </div>
      <button type="submit" class="btn btn-block">Sign in</button>
      <div class="demo-note">Sign in to access your personal order history and cart.</div>
    </form>

    <div class="auth-switch">New here? <a href="signup.html">Create an account</a></div>
  </div>
</main>

<footer class="site-footer">
  <div class="wrap">
    <span>VeerG's Xtore — a class project storefront.</span>
    <span>Secure payments powered by Stripe.</span>
  </div>
</footer>

<!-- Bootstrap 5 Bundle JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
<script src="js/app.js"></script>
<script>
  const form = document.getElementById("login-form");
  form.addEventListener("submit", (e) => {
    e.preventDefault();
    let valid = true;
    form.querySelectorAll("input[required]").forEach(input => {
      const errorEl = input.parentElement.querySelector(".error-msg");
      if (!input.value.trim()) {
        input.classList.add("field-error");
        errorEl.classList.add("show");
        valid = false;
      } else {
        input.classList.remove("field-error");
        errorEl.classList.remove("show");
      }
    });
    if (!valid) return;

    Store.api("/auth/login", { method: "POST", body: JSON.stringify({ email: form.email.value, password: form.password.value }) })
      .then(user => { Store.setUser(user); window.location.href = "index.html"; })
      .catch(error => alert(error.message));
  });
</script>

</body>
</html>
